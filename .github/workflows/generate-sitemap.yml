name: Generate vehicle sitemap

on:
  schedule:
    # Runs at 06:00 and 18:00 UTC (approx 6pm and 6am NZT) - adjust as needed.
    - cron: '0 6,18 * * *'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install headless browser
        run: npx playwright install --with-deps chromium

      # continue-on-error here means a flaky website crawl (e.g. a button that
      # isn't quite ready to click yet) can't block the remarketing feed step
      # below - the two are unrelated and should succeed or fail independently.
      # A crawl failure still fails the overall run (see the final step), so
      # it stays visible - it just no longer blocks the other feed.
      - name: Generate sitemap.xml
        id: crawl
        continue-on-error: true
        run: node crawl-sitemap.js

      - name: Generate remarketing-feed.csv
        env:
          AUTOPLAY_API_KEY: ${{ secrets.AUTOPLAY_API_KEY }}
        run: node build-remarketing-feed.js

      # Pings IndexNow (Bing etc.) with only the URLs that are new, changed,
      # or have dropped out of either sitemap since the last run - covers both
      # the Squarespace native sitemap and this repo's vehicle sitemap. Runs
      # after the sitemap crawl above so it's diffing the freshest data, and
      # continue-on-error so a hiccup here can't block the commit/push step
      # below (the sitemap files themselves are what actually matter most).
      - name: Notify IndexNow of sitemap changes
        id: indexnow
        continue-on-error: true
        run: node submit-indexnow.js

      - name: Commit and push generated files if they changed
        run: |
          git config user.name "4guys-sitemap-bot"
          git config user.email "actions@github.com"
          git add sitemap.xml remarketing-feed.csv indexnow-snapshot.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update sitemap.xml, remarketing-feed.csv and indexnow-snapshot.json ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Fail run if the sitemap crawl failed
        if: steps.crawl.outcome == 'failure'
        run: |
          echo "Sitemap crawl failed - remarketing feed was still refreshed above, but the sitemap crawl itself needs attention."
          exit 1

      - name: Fail run if IndexNow notification failed
        if: steps.indexnow.outcome == 'failure'
        run: |
          echo "IndexNow submission failed - sitemap and remarketing feed were still refreshed above, but new/changed pages weren't pinged this run."
          exit 1
