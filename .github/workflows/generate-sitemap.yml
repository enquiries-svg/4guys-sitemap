name: Generate vehicle sitemap

on:
  schedule:
    # Runs at 06:00 and 18:00 UTC (approx 6pm and 6am NZT) - adjust as needed.
    - cron: '0 6,18 * * *'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Downloads Chromium plus the system packages it needs from Ubuntu's mirrors.
      # Those mirrors occasionally fail to resolve on GitHub's runners, so each
      # attempt is capped at 5 minutes and retried up to 3 times. continue-on-error
      # means a failed install only skips the two steps that need the browser
      # (sitemap crawl and homepage search); the API-based feeds still refresh,
      # and the explicit failure check at the bottom keeps the problem visible.
      - name: Install headless browser
        id: browser
        continue-on-error: true
        timeout-minutes: 18
        run: |
          for attempt in 1 2 3; do
            if timeout 300 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Browser install attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 30 seconds..."
              sleep 30
            fi
          done
          exit 1

      # continue-on-error here means a flaky website crawl (e.g. a button that
      # isn't quite ready to click yet) can't block the remarketing feed step
      # below - the two are unrelated and should succeed or fail independently.
      # A crawl failure still fails the overall run (see the final step), so
      # it stays visible - it just no longer blocks the other feed.
      - name: Generate sitemap.xml
        id: crawl
        if: steps.browser.outcome == 'success'
        continue-on-error: true
        run: node crawl-sitemap.js

      - name: Generate remarketing-feed.csv
        env:
          AUTOPLAY_API_KEY: ${{ secrets.AUTOPLAY_API_KEY }}
        run: node build-remarketing-feed.js

      # Full replacement feed for the "Catalog_Vehicles" catalog's primary data source
      # in Meta Commerce Manager. Meta's self-serve UI doesn't support true
      # supplementary-feed merging for the Vehicles vertical (every extra feed is
      # validated as a brand-new, complete product, not merged onto existing items by
      # vehicle_id - confirmed by testing), so instead of overlaying a few fields onto
      # AutoPlay's own Facebook feed (fbookAd.ashx), this mirrors that feed's 22 columns
      # byte-for-byte (same data.autoplay.co.nz source Commerce Manager already reads,
      # no API key required) and adds only what's missing: fuel_type, transmission, and
      # a custom_label_0 price-bracket segment. Once this is live, Commerce Manager's
      # primary feed URL gets pointed at this file instead of AutoPlay's feed directly.
      # continue-on-error + the explicit failure check at the bottom (same pattern as
      # the crawl/IndexNow steps above) means a hiccup here can't block sitemap/Google
      # feed publishing.
      - name: Generate meta-vehicle-feed.csv
        id: meta_feed
        continue-on-error: true
        run: node build-meta-vehicle-feed.js

      # Feed for TikTok's dedicated "Auto - Inventory" catalog (Automotive Ads), a
      # richer field set (make/model/year/mileage/body style/drivetrain/dealer
      # location) than the generic e-commerce fields TikTok's existing Google-Merchant-
      # Center-based catalog import produces. Separate catalog from the existing
      # TikTok "Vehicles" (E-commerce) catalog - this doesn't touch or replace it.
      # continue-on-error + explicit failure check below, same pattern as the other
      # optional feed steps, so a hiccup here can't block sitemap/Google/Meta feed
      # publishing.
      - name: Generate tiktok-vehicle-feed.csv
        id: tiktok_feed
        continue-on-error: true
        run: node build-tiktok-vehicle-feed.js

      # Data file behind the homepage vehicle search widget. Opens every vehicle page
      # listed in sitemap.xml (so it must run after the crawl above) to read the full
      # AutoPlay features list (seats, Isofix, towbar, CarPlay etc.), which none of the
      # ad feeds carry. Skipped if the crawl failed, so it never runs on a stale or
      # missing sitemap; refuses to overwrite vehicles.json if under 80% of pages read.
      # continue-on-error + explicit failure check below, same pattern as other steps.
      - name: Generate vehicles.json (homepage search)
        id: search_index
        if: steps.crawl.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        run: node build-search-index.js

      # Pings IndexNow (Bing etc.) with only the URLs that are new, changed,
      # or have dropped out of either sitemap since the last run - covers both
      # the Squarespace native sitemap and this repo's vehicle sitemap. Runs
      # after the sitemap crawl above so it's diffing the freshest data, and
      # continue-on-error so a hiccup here can't block the commit/push step
      # below (the sitemap files themselves are what actually matter most).
      - name: Notify IndexNow of sitemap changes
        id: indexnow
        continue-on-error: true
        run: node submit-indexnow.js

      - name: Commit and push generated files if they changed
        run: |
          git config user.name "4guys-sitemap-bot"
          git config user.email "actions@github.com"
          git add sitemap.xml remarketing-feed.csv meta-vehicle-feed.csv tiktok-vehicle-feed.csv indexnow-snapshot.json vehicles.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update sitemap.xml, remarketing-feed.csv, meta-vehicle-feed.csv, tiktok-vehicle-feed.csv, vehicles.json and indexnow-snapshot.json ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Fail run if the headless browser install failed
        if: steps.browser.outcome == 'failure'
        run: |
          echo "Headless browser install failed after 3 attempts - remarketing, Meta and TikTok feeds were still refreshed above, but the sitemap crawl and homepage search (vehicles.json) were skipped this run."
          exit 1

      - name: Fail run if the sitemap crawl failed
        if: steps.crawl.outcome == 'failure'
        run: |
          echo "Sitemap crawl failed - remarketing feed was still refreshed above, but the sitemap crawl itself needs attention."
          exit 1

      - name: Fail run if the Meta vehicle feed failed
        if: steps.meta_feed.outcome == 'failure'
        run: |
          echo "Meta vehicle feed generation failed - sitemap and Google remarketing feed were still refreshed above, but meta-vehicle-feed.csv wasn't updated this run. Commerce Manager's primary feed is unaffected until its URL is switched over."
          exit 1

      - name: Fail run if the TikTok vehicle feed failed
        if: steps.tiktok_feed.outcome == 'failure'
        run: |
          echo "TikTok vehicle feed generation failed - other feeds were still refreshed above, but tiktok-vehicle-feed.csv wasn't updated this run. TikTok's Automotive Ads catalog is unaffected until its product source is pointed at this file."
          exit 1

      - name: Fail run if the vehicle search index failed
        if: steps.search_index.outcome == 'failure'
        run: |
          echo "vehicles.json generation failed - other feeds were still refreshed above, but the homepage search is showing the previous day's stock."
          exit 1

      - name: Fail run if IndexNow notification failed
        if: steps.indexnow.outcome == 'failure'
        run: |
          echo "IndexNow submission failed - sitemap and remarketing feed were still refreshed above, but new/changed pages weren't pinged this run."
          exit 1